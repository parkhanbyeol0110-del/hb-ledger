<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>HB's Ledger</title>
      <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
      <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
      <style>
          body { font-family: 'Pretendard', sans-serif; background: #F4F7F6; color: #2D3748; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        header { background: linear-gradient(135deg, #A8D5BA, #FDE49C); padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 25px; }
                  header h1 { margin: 0 0 5px; color: #2D3748; font-size: 24px; }
        header p { margin: 0; color: #4A5568; font-size: 14px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #4A5568; }
        input, select { padding: 10px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; }
        button { background: #A8D5BA; color: #2D3748; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
                button:hover { background: #7CBFA0; }
        .actions { display: flex; gap: 10px; margin-bottom: 25px; }
        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: #F8F9FA; padding: 15px; border-radius: 10px; border-left: 4px solid #A8D5BA; }
                .card h3 { margin: 0 0 5px; font-size: 14px; color: #718096; }
        .card .value { font-size: 20px; font-weight: 700; color: #2D3748; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        th { background: #F8F9FA; color: #4A5568; }
            </style>
              </head>
              <body>
                  <div class="container">
                      <header>
                          <h1>HB's Ledger</h1>
                          <p>Track your expenses and spending habits smartly</p>
        </header>
        <div class="form-grid">
            <div class="form-group"><label>Date</label><input type="date" id="date"></div>
            <div class="form-group"><label>Description</label><input type="text" id="desc" placeholder="Enter description"></div>
                      <div class="form-group"><label>Category</label><select id="category"><option>Fixed</option><option>Variable</option><option>Impulse</option></select></div>
                      <div class="form-group"><label>Amount ($)</label><input type="number" id="amount" placeholder="Enter amount"></div>
                  </div>
                  <div class="actions">
                      <button onclick="addExpense()">Add Expense</button>
                      <button onclick="exportExcel()">Export Excel</button>
                  </div>
                  <div class="summary-cards">
                      <div class="card"><h3>Total Amount</h3><div class="value" id="totalAmount">0</div></div>
                  </div>
                  <table>
                      <thead>
                          <tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Action</th></tr>
                      </thead>
                      <tbody id="expenseList"></tbody>
                  </table>
    </div>
              <script>
                  document.getElementById('date').valueAsDate = new Date();
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        function render() {
                      const list = document.getElementById('expenseList');
            list.innerHTML = '';
                          let total = 0;
            expenses.forEach((item, index) => {
                              total += Number(item.amount);
                              list.innerHTML += `<tr>
                                                    <td>${item.date}</td><td>${item.desc}</td><td>${item.category}</td>
                                                    <td>${item.amount}</td>
                                                    <td><button onclick="del(${index})" style="padding:4px 8px; background:#FFB7B2; font-size:12px;">Delete</button></td>
                                                </tr>`;
        });
            document.getElementById('totalAmount').innerText = total;
            localStorage.setItem('expenses', JSON.stringify(expenses));
           }
        function addExpense() {
                      const date = document.getElementById('date').value;
            const desc = document.getElementById('desc').value;
            const category = document.getElementById('category').value;
            const amount = document.getElementById('amount').value;
            if(!desc || !amount) { alert('Please enter description and amount'); return; }
            expenses.push({date, desc, category, amount});
            document.getElementById('desc').value = '';
                          document.getElementById('amount').value = '';
                                        render();
        }
        function del(index) { expenses.splice(index, 1); render(); }
        function exportExcel() {
                      const ws = XLSX.utils.json_to_sheet(expenses);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Ledger");
            XLSX.writeFile(wb, "hb-ledger.xlsx");
        }
        render();
    </script>
      </body>
      </html>
